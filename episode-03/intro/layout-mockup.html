<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ep3 Intro Layout</title>
<!--
  Layout mockup for the Ep.3 intro time slice (1920x1080), not final art.
  Crash: Zhou Guanyu, British GP 2022 (Silverstone), lap 1.
  VO: "From the first impact to the car coming to rest, structures, restraints
  and protective equipment work together to absorb energy, control forces and
  protect the driver."
  ?state=1 open full-frame | 2 first still | 3 all stills | 4 end hold
  Times are placeholders - set them from the footage.
-->
<style>
  :root {
    --bg: #17181c; --line: #e9e4da; --muted: #8a8e96; --note: #7fd1ff;
    --tape: #efe2b6; --print: #f7f5f0;
    --structures: #e0262f; --restraints: #f2a01f; --equipment: #3d8bfd;
  }
  html, body { margin: 0; background: var(--bg); }
  #frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
    font-family: "Liberation Sans", Arial, sans-serif; color: var(--line); }

  .video { position: absolute; left: 288px; top: 36px; width: 1344px; height: 756px; overflow: hidden;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 2px, transparent 2px 22px),
      linear-gradient(180deg, #3a4048 0%, #2a2e35 55%, #24272c 100%);
    outline: 2px solid rgba(255,255,255,.08); }
  .video.full { left: 0; top: 0; width: 1920px; height: 1080px; outline: 0; }
  .video .tag { position: absolute; left: 32px; top: 28px; font: 700 22px/1 "Liberation Mono", monospace; letter-spacing: .08em;
    background: rgba(0,0,0,.45); padding: 10px 14px; }
  .video .tag b { color: var(--structures); }
  .video .label { position: absolute; inset: 0; display: grid; place-items: center; font: 600 40px/1.3 sans-serif;
    color: rgba(255,255,255,.35); text-align: center; letter-spacing: .04em; }
  .video .label small { display: block; font-size: 22px; color: rgba(255,255,255,.28); }

  .print { position: absolute; top: 740px; width: 320px; padding: 10px 10px 16px; background: var(--print);
    box-shadow: 0 18px 30px rgba(0,0,0,.55); transform: translateX(-50%) rotate(var(--r)); }
  .print .img { height: 180px; display: grid; place-items: center; font: 600 16px/1.3 sans-serif; color: rgba(255,255,255,.6);
    text-align: center; padding: 0 16px;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 2px, transparent 2px 14px), #3a3f48; }
  /* category colour bar along the bottom of each print */
  .print .cat { height: 8px; margin-top: 8px; background: var(--c); }
  .tape { position: absolute; left: 50%; top: -26px; transform: translateX(-50%) rotate(calc(var(--r) * -1.6));
    background: var(--tape); color: #1d1f24; padding: 8px 16px 7px; white-space: nowrap; box-shadow: 0 2px 4px rgba(0,0,0,.25);
    clip-path: polygon(2% 0, 98% 4%, 100% 50%, 97% 100%, 3% 96%, 0 50%); }
  .tape b { font: 800 18px/1 "Liberation Mono", monospace; }
  .tape b i { font-style: normal; color: var(--c); }
  .tape span { display: block; font: 600 14px/1.2 sans-serif; margin-top: 4px; }

  svg.tl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  .clock { position: absolute; left: 1664px; top: 972px; font: 700 46px/1 "Liberation Mono", monospace; }
  .clock small { display: block; font: 600 14px/1 sans-serif; color: var(--muted); letter-spacing: .12em; margin-bottom: 6px; }

  .band { position: absolute; inset: 0; }
  #frame.s4 .video { display: none; }
  #frame.s4 .band { transform: translateY(-380px); }

  .note { position: absolute; left: 40px; width: 220px; font: 600 17px/1.35 sans-serif; color: var(--note); }
  .note.vo { font-style: italic; color: #c9e9ff; }
  .note.vo::before { content: "VO  "; font-style: normal; font-weight: 800; color: var(--note); }
  .note.vo em { color: #fff; font-weight: 800; text-decoration: underline; }
  .full-notes .note { width: 1700px; }
</style>
</head>
<body>
<div id="frame">
  <div class="video" id="video">
    <div class="tag"><b>●</b> BRITISH GP 2022 · LAP 1</div>
    <div class="label"><div>CRASH FOOTAGE (live)<small>keeps playing behind the stills</small></div></div>
  </div>
  <div class="band" id="band"></div>
</div>
<script>
const state = Number(new URLSearchParams(location.search).get("state") || 3);
const frame = document.getElementById("frame");
const band = document.getElementById("band");
frame.classList.add("s" + state);

// Timeline: x 288..1632 = 0..SECS (aligned to the video edges). Placeholder times.
const X0 = 288, X1 = 1632, SECS = 6, TY = 1000;
const tx = s => X0 + (X1 - X0) * s / SECS;
const STILLS = [
  { t: 0.8, cat: "STRUCTURES",           c: "var(--structures)", note: "Halo carries the car upside down", grab: "car inverted, sliding on the halo", x: 512,  r: "-2.5deg" },
  { t: 3.2, cat: "RESTRAINTS",           c: "var(--restraints)", note: "Harness + HANS hold the driver",   grab: "digs into gravel, launches over the tyre barrier", x: 960,  r: "2deg" },
  { t: 5.6, cat: "PROTECTIVE EQUIPMENT", c: "var(--equipment)",  note: "Helmet, suit, gloves",             grab: "car at rest between barrier and fence", x: 1408, r: "-2deg" },
];
const shown = { 1: 0, 2: 1, 3: 3, 4: 3 }[state];
const now = { 1: 0, 2: 0.8, 3: 6.0, 4: 6.0 }[state];

if (state === 1) {
  document.getElementById("video").classList.add("full");
} else {
  const s = STILLS.slice(0, shown);
  band.insertAdjacentHTML("beforeend", `
  <svg class="tl" viewBox="0 0 1920 1080">
    <line x1="${X0}" y1="${TY}" x2="${X1}" y2="${TY}" stroke="#555a63" stroke-width="3"/>
    <line x1="${X0}" y1="${TY}" x2="${tx(now)}" y2="${TY}" stroke="var(--line)" stroke-width="5"/>
    ${[0,1,2,3,4,5,6].map(v => `<line x1="${tx(v)}" y1="${TY-6}" x2="${tx(v)}" y2="${TY+6}" stroke="#555a63" stroke-width="2"/>
      <text x="${tx(v)}" y="${TY+28}" fill="#6b7078" font-size="15" font-family="Liberation Mono, monospace" text-anchor="middle">${v}s</text>`).join("")}
    <text x="${X0}" y="${TY+52}" fill="var(--muted)" font-size="15" font-weight="700" font-family="Liberation Sans, Arial" letter-spacing="1.5" text-anchor="start">FIRST IMPACT</text>
    ${now >= SECS ? `<text x="${X1}" y="${TY+52}" fill="var(--muted)" font-size="15" font-weight="700" font-family="Liberation Sans, Arial" letter-spacing="1.5" text-anchor="end">AT REST</text>` : ""}
    ${s.map(p => `<line x1="${p.x}" y1="955" x2="${tx(p.t)}" y2="${TY}" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5" opacity=".8"/>
      <circle cx="${tx(p.t)}" cy="${TY}" r="10" fill="${p.c}" stroke="var(--bg)" stroke-width="3"/>`).join("")}
    <circle cx="${tx(now)}" cy="${TY}" r="7" fill="var(--line)"/>
  </svg>`);
  s.forEach(p => band.insertAdjacentHTML("beforeend", `
    <div class="print" style="left:${p.x}px;--r:${p.r};--c:${p.c}">
      <div class="tape"><b>T+${p.t.toFixed(1)}s · <i>${p.cat}</i></b><span>${p.note}</span></div>
      <div class="img">frame grab:<br>${p.grab}</div>
      <div class="cat"></div>
    </div>`));
  band.insertAdjacentHTML("beforeend", `<div class="clock"><small>ELAPSED</small>T+${now.toFixed(1)}s</div>`);
}

// Mockup-only notes: what happens + which VO words land on this state.
const VO = {
  1: `<em>From the first impact</em> to the car coming to rest,`,
  2: `…<em>structures</em>,`,
  3: `…restraints <em>and protective equipment</em> work together…`,
  4: `…to absorb energy, control forces <em>and protect the driver.</em>`,
};
const NOTE = {
  1: "Opens full-frame on the first impact. On “structures” the frame freezes, shrinks into print 1 and the video scales to 70%.",
  2: "Freeze → flash → frame drops into its slot. Video carries on at 1.5–2× until the next word.",
  3: "One still per VO word, colour-coded. Clock stops when the car comes to rest.",
  4: "Video fades, band rises to centre. Push into the Protective Equipment print → kit section.",
};
if (state === 1) {
  frame.insertAdjacentHTML("beforeend", `<div class="full-notes"><div class="note" style="top:930px">▸ ${NOTE[1]}</div>
    <div class="note vo" style="top:975px">${VO[1]}</div></div>`);
} else {
  frame.insertAdjacentHTML("beforeend", `<div class="note" style="top:40px">▸ ${NOTE[state]}</div>
    <div class="note vo" style="top:${state === 4 ? 300 : 260}px">${VO[state]}</div>`);
}
</script>
</body>
</html>
